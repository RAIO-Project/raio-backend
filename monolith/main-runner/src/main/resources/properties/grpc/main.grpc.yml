grpc:
  server:
    port: ${GRPC_SERVER_PORT:9090}

app:
  grpc:
    clients:
      wallet:
        target: ${PAYMENT_GRPC_TARGET:localhost:9090}
        plaintext: ${PAYMENT_GRPC_PLAINTEXT:true}
        timeout: ${PAYMENT_GRPC_TIMEOUT:3s}

      settlement:
        target: ${SETTLEMENT_GRPC_TARGET:localhost:9090}
        plaintext: ${SETTLEMENT_GRPC_PLAINTEXT:true}
        timeout: ${SETTLEMENT_GRPC_TIMEOUT:3s}