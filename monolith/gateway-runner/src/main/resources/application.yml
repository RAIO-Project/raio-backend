spring:
  application:
    name: raio-gateway
  main:
    web-application-type: reactive   #  springdoc-webmvc를 전 모듈에 주입하므로 필수

  cloud:
    gateway:
      httpclient:
        connect-timeout: 3000        # ms — 인스턴스가 죽어 있을 때 빠르게 다음 시도로 넘어가게
        response-timeout: 10s        # 다운스트림 응답 상한 (부하테스트 시 조정 대상)

      routes:
        # WebSocket — 반드시 REST 라우트보다 먼저. lb:ws 스킴이어야 업그레이드가 프록시된다.
        # STOMP 토큰은 업그레이드 이후 CONNECT 프레임에 실려 오므로 게이트웨이가 인증하지 않는다.
        # 인증은 앱의 StompAuthChannelInterceptor 담당.
        - id: ws-service
          uri: lb:ws://main-service
          predicates:
            - Path=/ws/**

        # REST 전체 — main-runner 인스턴스들로 로드밸런싱
        - id: main-service
          uri: lb://main-service     # 해석은 프로파일이 결정 (local=정적 목록, 이후 eureka 프로파일=디스커버리)
          predicates:
            - Path=/**

app:
  gateway:
    auth:
      # 토큰 없이 통과. 토큰을 아직 못 받은 요청과 문서/헬스체크만 열어둔다.
      permit-paths:
        - /auth/register
        - /auth/login
        - /auth/refresh
        - /ws/**
        - /actuator/health
        - /swagger-ui/**
        - /v3/api-docs/**
      # 검증 결과를 다운스트림에 넘길 헤더. 클라이언트가 보낸 동일 헤더는 필터가 먼저 제거한다.
      user-id-header: X-Auth-User-Id
      nickname-header: X-Auth-Nickname
      roles-header: X-Auth-Roles

jwt:
  secret-key: ${JWT_SECRET_KEY}
  access-token-max-age-seconds: ${JWT_ACCESS_TTL:1800}
  refresh-token-max-age-seconds: ${JWT_REFRESH_TTL:1209600}

server:
  port: 8000
